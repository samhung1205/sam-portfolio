<!DOCTYPE html>
<!-- shell:{{shellVersion}} -->
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{title}}</title>
  <meta name="description" content="{{description}}" />
  <link rel="canonical" href="{{canonicalUrl}}" />

  <meta property="og:type" content="{{ogType}}" />
  <meta property="og:site_name" content="{{siteName}}" />
  <meta property="og:locale" content="{{siteLocale}}" />
  <meta property="og:title" content="{{title}}" />
  <meta property="og:description" content="{{description}}" />
  <meta property="og:url" content="{{canonicalUrl}}" />

  <meta name="twitter:card" content="{{twitterCard}}" />
  <meta name="twitter:title" content="{{title}}" />
  <meta name="twitter:description" content="{{description}}" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fortawesome/fontawesome-free@6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="{{pathPrefix}}css/style.css?v={{buildVersion}}" />{{extraCss}}
  <!-- JS 失敗時內容仍須可見（design-system/MASTER.md §16）：.reveal /
       .fade-in 預設 opacity:0，只有 initReveal() 的 IntersectionObserver
       會補上 is-visible。沒有 JS 就永遠是 0，此處強制蓋回可見。 -->
  <noscript><style>.reveal,.fade-in{opacity:1 !important;transform:none !important;}</style></noscript>
</head>
